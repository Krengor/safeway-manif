# Déploiement mono-serveur de référence. La cible 500k (§47-60) nécessite une
# architecture multi-instances : voir docs/architecture.md.
#
# Ne pas lancer à la main : infrastructure/deploy/deploy.sh construit les images, sauvegarde,
# migre, redémarre service par service et revient en arrière en cas d'échec (docs/deploiement.md).
#
# SAFEWAY_VERSION (commit déployé) étiquette les images : un retour arrière réutilise les
# images précédentes sans reconstruction.
name: safeway

# Journaux : erreurs uniquement (les métriques couvrent le reste), rotation pour ne jamais
# remplir le disque. Ni IP, ni URL complète, ni corps de requête (voir docs/privacy.md).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: safeway
      POSTGRES_USER: safeway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_duration_statement=-1", "-c", "log_connections=off"]
    volumes:
      - pgdata:/var/lib/postgresql/data   # placer ce volume sur un disque chiffré (§16.2)
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeway -d safeway"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no",
              "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    networks: [backend]

  migrate:
    image: safeway-api:${SAFEWAY_VERSION:-local}
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    logging: *logging
    command: ["node", "dist/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://safeway:${POSTGRES_PASSWORD}@postgres:5432/safeway
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  api:
    image: safeway-api:${SAFEWAY_VERSION:-local}
    build: { context: ../.., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_ORIGIN: https://${SAFEWAY_DOMAIN:?}
      WEBAUTHN_RP_ID: ${SAFEWAY_DOMAIN}
      DATABASE_URL: postgres://safeway:${POSTGRES_PASSWORD}@postgres:5432/safeway
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VOTE_TOKEN_SECRET: ${VOTE_TOKEN_SECRET:?}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?}
      EVENT_SIGNING_KEY: ${EVENT_SIGNING_KEY:?}
      TRUST_PROXY_HOPS: 1
      LOG_LEVEL: warn
      # Métriques internes (§64) : réseau backend uniquement, jamais publiées ni routées par Caddy.
      METRICS_PORT: 9100
      METRICS_HOST: 0.0.0.0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    networks: [backend]

  gateway:
    image: safeway-gateway:${SAFEWAY_VERSION:-local}
    build: { context: ../.., dockerfile: infrastructure/docker/gateway.Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_ORIGIN: https://${SAFEWAY_DOMAIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: warn
      METRICS_PORT: 9100
      METRICS_HOST: 0.0.0.0
    depends_on:
      redis: { condition: service_started }
    networks: [backend]

  # Moteur d'itinéraire. Le graphe se construit au premier démarrage à partir du .osm.pbf
  # placé dans infrastructure/valhalla/custom_files (ou construit ailleurs puis copié).
  # Aucun journal : les requêtes contiennent des points de départ et d'arrivée.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    environment:
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      serve_tiles: "True"
      server_threads: "2"
    volumes:
      - ../valhalla/custom_files:/custom_files
    logging:
      driver: none
    networks: [backend]

  routing:
    image: safeway-routing:${SAFEWAY_VERSION:-local}
    build: { context: ../.., dockerfile: infrastructure/docker/routing.Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_ORIGIN: https://${SAFEWAY_DOMAIN}
      VALHALLA_URL: http://valhalla:8002
      MAP_API_URL: http://api:3000
      TRUST_PROXY_HOPS: 1
      LOG_LEVEL: warn
    depends_on: [valhalla, api]
    networks: [backend]

  web:
    image: safeway-web:${SAFEWAY_VERSION:-local}
    build: { context: ../.., dockerfile: infrastructure/docker/web.Dockerfile }
    restart: unless-stopped
    logging: *logging
    environment:
      SAFEWAY_DOMAIN: ${SAFEWAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../../apps/web/public/tiles:/srv/map/tiles:ro
      - ../../apps/web/public/fonts:/srv/map/fonts:ro
      - ../../apps/web/public/sprites:/srv/map/sprites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, gateway, routing]
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
