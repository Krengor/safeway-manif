# Infrastructure de développement : PostgreSQL/PostGIS + Redis.
# Lancement depuis la racine : npm run dev:infra   (lit les mots de passe dans .env)
# Ports liés à 127.0.0.1 uniquement : rien n'est exposé au réseau local.
name: safeway-dev

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: safeway
      POSTGRES_USER: safeway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    # Pas de journalisation des requêtes : elles contiennent des cellules H3.
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_duration_statement=-1"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeway -d safeway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Aucune persistance disque : Redis ne contient que des données éphémères (§52).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  pgdata:
